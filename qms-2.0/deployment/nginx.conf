limit_req_zone $binary_remote_addr zone=qms_inbound:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/customer-quality/complaints/import {
        client_max_body_size 6m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/v1/customer-quality/ledger/import/preview {
        client_max_body_size 7m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/v1/customer-quality/ledger/import/commit {
        client_max_body_size 7m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~* ^/api/v1/integrations/inbound/ {
        client_max_body_size 1m;
        client_body_timeout 10s;
        limit_req zone=qms_inbound burst=100 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
