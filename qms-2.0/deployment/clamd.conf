Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
LogTime yes
MaxThreads 2
MaxQueue 8
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 20000
CommandReadTimeout 10
ReadTimeout 30
SendBufTimeout 1000
AlertExceedsMax yes
AlertEncrypted yes
ConcurrentDatabaseReload no
