services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    extra_hosts:
      - "qms.bigshuaibee.cn:host-gateway"

  worker:
    restart: unless-stopped
    extra_hosts:
      - "qms.bigshuaibee.cn:host-gateway"

  web:
    restart: unless-stopped
    networks:
      default: {}
      qms_proxy:
        aliases:
          - qms_nginx

  rustfs:
    restart: unless-stopped
    networks:
      default: {}
      qms_proxy:
        aliases:
          - qms_rustfs

networks:
  qms_proxy:
    external: true
    name: ${NPM_DOCKER_NETWORK:?Set NPM_DOCKER_NETWORK}
