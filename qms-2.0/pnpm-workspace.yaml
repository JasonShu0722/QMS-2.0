packages:
  - apps/*
  - packages/*

fetchTimeout: 600000
fetchRetries: 5
networkConcurrency: 4

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1136.0'
  - '@aws-sdk/s3-request-presigner@3.1136.0'
