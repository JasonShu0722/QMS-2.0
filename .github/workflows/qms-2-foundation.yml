name: QMS 2.0 foundation

on:
  push:
    branches: [main]
    paths:
      - 'qms-2.0/**'
      - 'docs/superpowers/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/qms-2-foundation.yml'
      - '.github/workflows/qms-2-deploy.yml'
  pull_request:
    paths:
      - 'qms-2.0/**'
      - 'docs/superpowers/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/qms-2-foundation.yml'
      - '.github/workflows/qms-2-deploy.yml'

concurrency:
  group: qms-2-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Classify complete event diff
        id: classify
        working-directory: qms-2.0
        run: node scripts/ci-validation-scope.mjs scope

  checks:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qms-2.0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          working-directory: qms-2.0
          cache: true
          require-lockfile: true
      - name: Check archive isolation
        run: pnpm run check:archive-isolation
      - name: Check QMS development governance
        run: pnpm run check:governance
      - name: CI scope and result gate tests
        if: needs.scope.outputs.scope == 'documentation'
        run: node --test test/ci-validation-scope.test.mjs
      - name: Documentation governance tests
        if: needs.scope.outputs.scope == 'documentation'
        run: pnpm run test:governance
      - name: Check generated OpenAPI contract
        if: needs.scope.outputs.scope == 'full'
        run: pnpm run contracts:check
      - name: Workspace and contracts tests
        if: needs.scope.outputs.scope == 'full'
        run: |
          node --test test/*.test.mjs
          pnpm --filter @qms/contracts test

  web-tests:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: qms-2.0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          working-directory: qms-2.0
          cache: true
          require-lockfile: true
      - name: Web unit tests
        run: pnpm --filter @qms/web test --shard=${{ matrix.shard }}/4 --maxWorkers=1

  api-unit:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qms-2.0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          working-directory: qms-2.0
          cache: true
          require-lockfile: true
      - name: API unit tests
        run: pnpm --filter @qms/api test

  integration:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 51026:1025
          - 51027:8025
    defaults:
      run:
        working-directory: qms-2.0
    env:
      CI: 'true'
      PG_CONTAINER: qms2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTFS_CONTAINER: qms2-ci-rustfs-${{ github.run_id }}-${{ github.run_attempt }}
      CLAMAV_CONTAINER: qms2-ci-clamav-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          working-directory: qms-2.0
          cache: true
          require-lockfile: true
      - name: Build Web and API
        run: pnpm --recursive build
      - name: Create ephemeral integration services
        run: |
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          export POSTGRES_PASSWORD
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          docker run --detach --name "$PG_CONTAINER" -e POSTGRES_PASSWORD -e POSTGRES_USER=qms -e POSTGRES_DB=qms2 -p 127.0.0.1::5432 postgres:18
          for attempt in {1..30}; do
            if docker exec "$PG_CONTAINER" pg_isready -U qms -d qms2; then break; fi
            sleep 2
          done
          docker exec "$PG_CONTAINER" pg_isready -U qms -d qms2
          PG_PORT=$(docker port "$PG_CONTAINER" 5432/tcp | cut -d: -f2)
          DATABASE_URL="postgresql://qms:$POSTGRES_PASSWORD@127.0.0.1:$PG_PORT/qms2"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "QMS_DISPOSABLE_TEST_DB=true" >> "$GITHUB_ENV"
          for name in QMS_SEED_INTERNAL_PASSWORD QMS_SEED_SUPPLIER_PASSWORD QMS_RATE_LIMIT_SECRET; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          STORAGE_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$STORAGE_SECRET"
          echo "RUSTFS_ACCESS_KEY=qms-ci" >> "$GITHUB_ENV"
          echo "RUSTFS_SECRET_KEY=$STORAGE_SECRET" >> "$GITHUB_ENV"
          echo "QMS_OBJECT_STORAGE_PROVIDER=rustfs" >> "$GITHUB_ENV"
          echo "QMS_OBJECT_STORAGE_ACCESS_KEY=qms-ci" >> "$GITHUB_ENV"
          echo "QMS_OBJECT_STORAGE_SECRET_KEY=$STORAGE_SECRET" >> "$GITHUB_ENV"
          docker run --detach --name "$RUSTFS_CONTAINER" \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_ACCESS_KEY=qms-ci -e RUSTFS_SECRET_KEY="$STORAGE_SECRET" \
            -e RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true \
            -p 127.0.0.1::9000 rustfs/rustfs:1.0.0
          RUSTFS_PORT=$(docker port "$RUSTFS_CONTAINER" 9000/tcp | cut -d: -f2)
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:$RUSTFS_PORT/health" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent "http://127.0.0.1:$RUSTFS_PORT/health" >/dev/null
          echo "QMS_OBJECT_STORAGE_ENDPOINT=http://127.0.0.1:$RUSTFS_PORT" >> "$GITHUB_ENV"
          echo "QMS_OBJECT_STORAGE_BUCKET=qms-ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          docker run --detach --name "$CLAMAV_CONTAINER" --entrypoint clamd --user clamav \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 4g --cpus 2 \
            --tmpfs /tmp:size=134217728,mode=1777 \
            --volume "$PWD/deployment/clamd.conf:/etc/clamav/clamd.conf:ro" \
            -p 127.0.0.1::3310 \
            clamav/clamav@sha256:9cb27d7660bdf66e9878c832cb433dd8aa152cfbe16f3c2c0084c80b04ae22b4 \
            --config-file=/etc/clamav/clamd.conf
          for attempt in {1..90}; do
            if docker exec "$CLAMAV_CONTAINER" clamdscan --config-file=/etc/clamav/clamd.conf --ping=1; then break; fi
            sleep 2
          done
          docker exec "$CLAMAV_CONTAINER" clamdscan --config-file=/etc/clamav/clamd.conf --ping=1
          CLAMAV_PORT=$(docker port "$CLAMAV_CONTAINER" 3310/tcp | cut -d: -f2)
          echo "QMS_FILE_SCANNER_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "QMS_FILE_SCANNER_PORT=$CLAMAV_PORT" >> "$GITHUB_ENV"
          SECURITY_KEY=$(openssl rand -base64 32)
          echo "::add-mask::$SECURITY_KEY"
          KEYRING="{\"ci\":\"$SECURITY_KEY\"}"
          echo "::add-mask::$KEYRING"
          echo "QMS_SECURITY_CURRENT_KEY_ID=ci" >> "$GITHUB_ENV"
          echo "QMS_SECURITY_KEYRING=$KEYRING" >> "$GITHUB_ENV"
          echo "SMTP_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "SMTP_PORT=51026" >> "$GITHUB_ENV"
          echo "SMTP_SECURE=false" >> "$GITHUB_ENV"
          echo "SMTP_FROM=qms@example.test" >> "$GITHUB_ENV"
          echo "QMS_ACCEPTANCE_MAILPIT_URL=http://127.0.0.1:51027" >> "$GITHUB_ENV"
      - name: Prepare real object storage and scan fixture
        run: |
          command -v zip
          FIXTURE_DIRECTORY="$RUNNER_TEMP/qms-ci-file-fixture"
          mkdir -p "$FIXTURE_DIRECTORY"
          printf 'QMS harmless encrypted archive fixture\n' > "$FIXTURE_DIRECTORY/content.txt"
          zip -q -j -P qms-ci-fixture "$FIXTURE_DIRECTORY/encrypted.zip" "$FIXTURE_DIRECTORY/content.txt"
          echo "QMS_FILE_TEST_ENCRYPTED_PATH=$FIXTURE_DIRECTORY/encrypted.zip" >> "$GITHUB_ENV"
          node apps/api/test/fixtures/prepare-ci-object-storage.mjs
      - name: Real PostgreSQL integration tests
        env:
          NODE_ENV: development
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          # Release Jest VM state between shards without parallel writes to the disposable database.
          for shard in 1 2 3 4; do
            pnpm --filter @qms/api test:integration --shard="$shard/4"
          done
      - name: Real worker process lifecycle
        env:
          NODE_ENV: development
        run: pnpm --filter @qms/api test:worker-process:built
      - name: Validate foundation Compose
        run: docker compose -f deployment/docker-compose.foundation.yml config --quiet
      - name: Destroy ephemeral integration services
        if: always()
        run: |
          for container in "$PG_CONTAINER" "$RUSTFS_CONTAINER" "$CLAMAV_CONTAINER"; do
            docker rm --force --volumes "$container" || true
          done

  foundation:
    needs: [scope, checks, web-tests, api-unit, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Require every foundation check
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node qms-2.0/scripts/ci-validation-scope.mjs gate
